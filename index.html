<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Livro-Caixa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #E9E6DC;
    --paper-2: #E1DDCF;
    --surface: #F5F3EC;
    --ink: #23302C;
    --muted: #7A7568;
    --rule: #C9C3B0;
    --rule-soft: #D8D3C2;
    --teal: #2F6B5E;
    --teal-soft: #E1EAE5;
    --rust: #B5502D;
    --rust-soft: #F1E1D9;
    --gold: #A9791F;
    --gold-soft: #F0E6CC;
    --clay: #8B5E3B;
    --clay-soft: #EDE0D1;
    --shadow: rgba(35, 48, 44, 0.14);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #161D1B;
      --paper-2: #131917;
      --surface: #1E2724;
      --ink: #E8E4D9;
      --muted: #8C9490;
      --rule: #2E3934;
      --rule-soft: #263029;
      --teal: #59B39D;
      --teal-soft: #1E332E;
      --rust: #E28866;
      --rust-soft: #3A2620;
      --gold: #D8B45C;
      --gold-soft: #362C15;
      --clay: #C99A67;
      --clay-soft: #3A2E1E;
      --shadow: rgba(0, 0, 0, 0.4);
    }
  }
  :root[data-theme="dark"] {
    --paper: #161D1B;
    --paper-2: #131917;
    --surface: #1E2724;
    --ink: #E8E4D9;
    --muted: #8C9490;
    --rule: #2E3934;
    --rule-soft: #263029;
    --teal: #59B39D;
    --teal-soft: #1E332E;
    --rust: #E28866;
    --rust-soft: #3A2620;
    --gold: #D8B45C;
    --gold-soft: #362C15;
    --clay: #C99A67;
    --clay-soft: #3A2E1E;
    --shadow: rgba(0, 0, 0, 0.4);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    display: flex;
    flex-direction: column;
    min-height: 100%;
  }
  .serif { font-family: 'Fraunces', Georgia, serif; }

  header {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 20;
    background: var(--paper);
    border-bottom: 1px solid var(--rule);
    padding: 18px 20px 14px;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }
  .brand h1 {
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-optical-sizing: auto;
    font-size: clamp(22px, 4vw, 30px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand p {
    margin: 2px 0 0;
    color: var(--muted);
    font-size: 13px;
  }
  .reserve-pill {
    background: var(--gold-soft);
    border: 1px solid var(--gold);
    border-radius: 10px;
    padding: 8px 14px;
    text-align: right;
    min-width: 150px;
    flex-shrink: 0;
    cursor: pointer;
    transition: border-color 120ms ease;
  }
  .reserve-pill:hover, .reserve-pill:focus-visible { border-color: var(--ink); }
  .reserve-pill .label {
    display: block;
    font-size: 11px;
    color: var(--gold);
    font-weight: 500;
    margin-bottom: 2px;
  }
  .reserve-pill .value {
    display: block;
    font-size: 17px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
  }

  .header-bottom {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-top: 16px;
    flex-wrap: wrap;
  }
  .year-nav {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .year-nav button {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 120ms ease, transform 120ms ease;
  }
  .year-nav button:hover { background: var(--rule-soft); }
  .year-nav button:active { transform: scale(0.94); }
  .year-nav .year-label {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 26px;
    font-weight: 500;
    min-width: 64px;
    text-align: center;
  }
  .today-balance {
    text-align: right;
  }
  .today-balance .label {
    font-size: 11px;
    color: var(--muted);
    display: block;
  }
  .today-balance .value {
    font-size: 18px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .value.positive { color: var(--teal); }
  .value.negative { color: var(--rust); }

  main {
    flex: 1;
    padding: 16px 20px 40px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .grid-wrap {
    overflow-x: auto;
    overflow-y: visible;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--surface);
    max-width: 100%;
  }
  .grid-slide {
    animation: slideIn 220ms ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateX(6px); }
    to { opacity: 1; transform: translateX(0); }
  }
  table {
    border-collapse: collapse;
    width: 100%;
    min-width: 780px;
    font-variant-numeric: tabular-nums;
  }
  thead th {
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    text-transform: lowercase;
    padding: 9px 6px;
    border-bottom: 1px solid var(--rule);
    text-align: center;
    white-space: nowrap;
  }
  thead th:first-child {
    position: sticky;
    left: 0;
    top: 0;
    z-index: 6;
    background: var(--surface);
  }
  tbody th {
    position: sticky;
    left: 0;
    background: var(--surface);
    z-index: 4;
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    padding: 6px 10px;
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule-soft);
    text-align: right;
  }
  td {
    border-bottom: 1px solid var(--rule-soft);
    border-right: 1px dashed var(--rule-soft);
    padding: 0;
    text-align: center;
    height: 30px;
  }
  td.cell {
    position: relative;
    cursor: pointer;
    font-size: 12px;
    padding: 5px 4px;
    transition: background 100ms ease;
  }
  td.cell:hover { background: var(--rule-soft); }
  td.cell.positive { color: var(--teal); }
  td.cell.negative { color: var(--rust); }
  td.cell.neutral { color: var(--muted); }
  td.cell.today { box-shadow: inset 0 0 0 2px var(--gold); border-radius: 2px; }
  td.void { background: repeating-linear-gradient(135deg, transparent, transparent 5px, var(--rule-soft) 5px, var(--rule-soft) 6px); }
  td.cell .dots {
    position: absolute;
    top: 3px;
    right: 3px;
    display: flex;
    gap: 2px;
  }
  td.cell .dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  td.cell .dot-entrada { background: var(--teal); }
  td.cell .dot-saida { background: var(--rust); }
  td.cell .dot-economia { background: var(--gold); }
  td.cell .dot-diario { background: var(--clay); }

  .view-tabs {
    display: flex;
    gap: 6px;
    margin-top: 14px;
  }
  .view-tab {
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 100px;
    cursor: pointer;
    font-family: inherit;
  }
  .view-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .monthly-table {
    border-collapse: collapse;
    width: 100%;
    font-variant-numeric: tabular-nums;
  }
  .monthly-table thead th {
    background: var(--surface);
    font-weight: 500;
    font-size: 12px;
    color: var(--muted);
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule);
    text-align: right;
  }
  .monthly-table thead th:first-child { text-align: left; }
  .monthly-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
    font-size: 13px;
    text-align: right;
  }
  .monthly-table td.month-name {
    text-align: left;
    font-size: 15px;
    text-transform: capitalize;
  }
  .monthly-table td.entrada-amt { color: var(--teal); }
  .monthly-table td.saida-amt { color: var(--rust); }
  .monthly-table td.economia-amt { color: var(--gold); }
  .monthly-table td.saldo { font-weight: 600; }
  .monthly-table td.positive { color: var(--teal); }
  .monthly-table td.negative { color: var(--rust); }
  .monthly-table td.neutral { color: var(--muted); }

  .hint {
    margin: 10px 2px 0;
    font-size: 12px;
    color: var(--muted);
  }
  .data-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 10px;
  }
  .reset-btn {
    margin: 0;
    align-self: flex-start;
    border: 1px solid var(--rule);
    background: none;
    color: var(--muted);
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
  }
  .reset-btn:hover { color: var(--ink); border-color: var(--ink); }
  #resetAllBtn:hover { color: var(--rust); border-color: var(--rust); }

  /* Modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 26, 24, 0.45);
    backdrop-filter: blur(2px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity 150ms ease;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface);
    border-radius: 14px;
    width: 100%;
    max-width: 380px;
    padding: 22px;
    box-shadow: 0 20px 50px var(--shadow);
    transform: translateY(8px);
    transition: transform 150ms ease;
    max-height: min(80vh, 640px);
    overflow-y: auto;
  }
  .overlay.open .modal { transform: translateY(0); }
  .modal-date {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 20px;
    margin: 0 0 2px;
    text-transform: capitalize;
  }
  .modal-balance {
    font-size: 13px;
    color: var(--muted);
    margin: 0 0 16px;
  }
  .modal-balance strong { color: var(--ink); font-variant-numeric: tabular-nums; }

  .movs {
    margin: 0 0 16px;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .movs li {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13px;
    background: var(--paper);
  }
  .mov-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .mov-desc {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 170px;
  }
  .mov-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .movs .tag {
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 100px;
    font-weight: 500;
  }
  .tag.entrada { background: var(--teal-soft); color: var(--teal); }
  .tag.saida { background: var(--rust-soft); color: var(--rust); }
  .tag.economia { background: var(--gold-soft); color: var(--gold); }
  .tag.diario { background: var(--clay-soft); color: var(--clay); }
  .mov-right .amount { font-variant-numeric: tabular-nums; }
  .movs .del, .movs .edit, .movs .diario-del, .movs .diario-edit {
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    line-height: 1;
    padding: 2px 4px;
  }
  .movs .del, .movs .diario-del { font-size: 14px; }
  .movs .del:hover, .movs .diario-del:hover { color: var(--rust); }
  .movs .edit:hover, .movs .diario-edit:hover { color: var(--ink); }
  .empty-movs { font-size: 12px; color: var(--muted); margin: 0 0 16px; }

  .edit-row {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    background: var(--paper);
  }
  .edit-hint {
    font-size: 11px;
    color: var(--muted);
    margin: 0;
  }

  .confirm-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    padding: 8px 10px;
    border-radius: 8px;
    background: var(--paper);
    font-size: 12px;
    color: var(--muted);
  }
  .confirm-row button {
    border: 1px solid var(--rule);
    background: var(--surface);
    color: var(--ink);
    border-radius: 6px;
    padding: 5px 9px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .confirm-row button:hover { background: var(--rule-soft); }

  .actions { display: flex; flex-direction: column; gap: 8px; }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    border: 1px solid var(--rule);
    background: var(--paper);
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    font-family: inherit;
  }
  .action-btn:hover { background: var(--rule-soft); }
  .action-btn .bar { width: 4px; align-self: stretch; border-radius: 3px; }
  .action-btn.entrada .bar { background: var(--teal); }
  .action-btn.saida .bar { background: var(--rust); }
  .action-btn.economia .bar { background: var(--gold); }
  .action-btn.diario .bar { background: var(--clay); }

  .form-block {
    display: flex;
    flex-direction: column;
    gap: 10px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 12px;
  }
  .form-value-row { display: flex; align-items: center; gap: 8px; }
  .form-value-row .bar { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .form-block.entrada .bar { background: var(--teal); }
  .form-block.saida .bar { background: var(--rust); }
  .form-block.diario .bar { background: var(--clay); }
  .form-value-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .desc-input {
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    outline: none;
  }
  .desc-input:focus { border-color: var(--ink); }
  .months-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--muted);
  }
  .months-row input {
    width: 64px;
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 4px 8px;
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: var(--surface);
  }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; }
  .indefinite-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .indefinite-toggle input { width: 16px; height: 16px; accent-color: var(--ink); cursor: pointer; }
  .payment-row {
    display: flex;
    gap: 16px;
  }
  .payment-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: var(--ink);
    cursor: pointer;
  }
  .payment-row input { width: 15px; height: 15px; accent-color: var(--ink); cursor: pointer; }

  .form-row {
    display: flex;
    align-items: center;
    gap: 8px;
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 10px 12px;
  }
  .form-row .bar { width: 4px; align-self: stretch; border-radius: 3px; flex-shrink: 0; }
  .form-row.entrada .bar { background: var(--teal); }
  .form-row.saida .bar { background: var(--rust); }
  .form-row.economia .bar { background: var(--gold); }
  .form-row input {
    flex: 1;
    border: none;
    background: transparent;
    font-size: 16px;
    font-family: inherit;
    color: var(--ink);
    outline: none;
    min-width: 0;
    font-variant-numeric: tabular-nums;
  }
  .form-row .save-btn {
    border: none;
    background: var(--ink);
    color: var(--paper);
    border-radius: 7px;
    padding: 7px 12px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }
  .form-row .cancel-btn {
    border: none;
    background: none;
    color: var(--muted);
    font-size: 18px;
    cursor: pointer;
    padding: 0 2px;
    flex-shrink: 0;
  }
  .close-modal {
    display: block;
    margin: 16px auto 0;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    padding: 6px;
  }
  .warn {
    font-size: 12px;
    color: var(--rust);
    margin: -2px 0 8px 4px;
  }

  @media (prefers-reduced-motion: reduce) {
    .grid-slide, .overlay, .modal { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <div class="brand">
      <h1>Livro-Caixa</h1>
      <p>Seu saldo, dia a dia, guardado só neste navegador</p>
    </div>
    <div class="reserve-pill" id="reservePill" role="button" tabindex="0">
      <span class="label">Reserva de emergência</span>
      <span class="value" id="reserveValue">R$ 0,00</span>
    </div>
  </div>
  <div class="view-tabs">
    <button class="view-tab active" id="tabGeral" data-view="geral">Visão geral</button>
    <button class="view-tab" id="tabMensal" data-view="mensal">Visão mensal</button>
  </div>
  <div class="header-bottom">
    <div class="year-nav">
      <button id="prevYear" aria-label="Ano anterior">‹</button>
      <span class="year-label serif" id="yearLabel">2026</span>
      <button id="nextYear" aria-label="Próximo ano">›</button>
    </div>
    <div class="today-balance">
      <span class="label">Saldo hoje</span>
      <span class="value" id="todayValue">R$ 0,00</span>
    </div>
  </div>
</header>

<main>
  <div class="grid-wrap" id="geralWrap">
    <table id="grid"></table>
  </div>
  <div class="grid-wrap" id="mensalWrap" style="display:none;">
    <table class="monthly-table" id="monthlyTable"></table>
  </div>
  <p class="hint" id="viewHint">Toque em um dia para lançar uma entrada, uma saída ou mover valor para a reserva.</p>
  <div class="data-actions">
    <button class="reset-btn" id="exportBtn">Exportar dados (.json)</button>
    <button class="reset-btn" id="importBtn">Importar dados</button>
    <button class="reset-btn" id="resetAllBtn">Zerar planilha</button>
  </div>
  <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;">
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <p class="modal-date serif" id="modalDate">—</p>
    <p class="modal-balance">Saldo no dia: <strong id="modalBalance">R$ 0,00</strong></p>

    <ul class="movs" id="movsList"></ul>

    <div class="actions" id="actionsBox">
      <button class="action-btn entrada" data-type="entrada"><span class="bar"></span>Entrada</button>
      <button class="action-btn saida" data-type="saida"><span class="bar"></span>Saída</button>
      <button class="action-btn economia" data-type="economia"><span class="bar"></span>Economia (mover para reserva)</button>
    </div>

    <button class="close-modal" id="closeModal">Fechar</button>
  </div>
</div>

<div class="overlay" id="reserveOverlay">
  <div class="modal">
    <p class="modal-date serif">Reserva de emergência</p>
    <p class="modal-balance">Saldo atual: <strong id="reserveModalValue">R$ 0,00</strong></p>

    <ul class="movs" id="reserveMovsList"></ul>

    <div class="actions" id="reserveActionsBox">
      <button class="action-btn economia" data-rtype="rendimento"><span class="bar"></span>Ajustar (rendeu na reserva)</button>
      <button class="action-btn saida" data-rtype="retirada"><span class="bar"></span>Retirar da reserva</button>
    </div>

    <button class="close-modal" id="closeReserveModal">Fechar</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  var STORAGE_KEY = "livro-caixa:transacoes:v1";
  var MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var MONTH_FULL = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var INDEFINITE_MONTHS = 360; // "a perder de vista": materializa 30 anos, removível a qualquer momento

  var todayObj = new Date();
  var todayStr = fmtKey(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());

  var state = {
    year: todayObj.getFullYear(),
    transactions: [],
    reserveAdjustments: [],
    diarios: []
  };
  var loaded = loadState();
  state.transactions = loaded.transactions;
  state.reserveAdjustments = loaded.reserveAdjustments;
  state.diarios = loaded.diarios;

  var sortedDates = [];
  var cumMap = {};
  var dailyDelta = {};
  var reserveTotal = 0;

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return { transactions: [], reserveAdjustments: [], diarios: [] };
      var parsed = JSON.parse(raw);
      if (Array.isArray(parsed)) return { transactions: parsed, reserveAdjustments: [], diarios: [] };
      return {
        transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
        reserveAdjustments: Array.isArray(parsed.reserveAdjustments) ? parsed.reserveAdjustments : [],
        diarios: Array.isArray(parsed.diarios) ? parsed.diarios : []
      };
    } catch (e) {
      return { transactions: [], reserveAdjustments: [], diarios: [] };
    }
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        transactions: state.transactions,
        reserveAdjustments: state.reserveAdjustments,
        diarios: state.diarios
      }));
    } catch (e) {
      /* storage unavailable — continue in-memory only */
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (ch) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch];
    });
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function fmtKey(y, mIdx, d) { return y + "-" + pad(mIdx + 1) + "-" + pad(d); }
  function daysInMonth(y, mIdx) { return new Date(y, mIdx + 1, 0).getDate(); }
  function parseKey(key) {
    var p = key.split("-").map(Number);
    return new Date(p[0], p[1] - 1, p[2]);
  }
  function dayDiff(aKey, bKey) {
    return Math.round((parseKey(bKey) - parseKey(aKey)) / 86400000);
  }
  function addDays(key, n) {
    var d = parseKey(key);
    d.setDate(d.getDate() + n);
    return fmtKey(d.getFullYear(), d.getMonth(), d.getDate());
  }
  function addMonthsToKey(key, months) {
    var parts = key.split("-").map(Number);
    var startYear = parts[0], startMonthIdx = parts[1] - 1, startDay = parts[2];
    var targetMonthIdx = startMonthIdx + months;
    var targetYear = startYear + Math.floor(targetMonthIdx / 12);
    var normMonthIdx = ((targetMonthIdx % 12) + 12) % 12;
    var dim = daysInMonth(targetYear, normMonthIdx);
    var targetDay = Math.min(startDay, dim);
    return fmtKey(targetYear, normMonthIdx, targetDay);
  }
  function formatShortDate(key) {
    var p = key.split("-");
    return p[2] + "/" + p[1] + "/" + p[0];
  }
  function creditBillDate(dateKey) {
    var parts = dateKey.split("-").map(Number);
    var y = parts[0], mIdx = parts[1] - 1, day = parts[2];
    if (day <= 14) return fmtKey(y, mIdx, 14);
    return addMonthsToKey(fmtKey(y, mIdx, 14), 1);
  }

  function currency(v) {
    var n = Number(v) || 0;
    return n.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  }
  function compact(v) {
    var n = Math.round(Number(v) || 0);
    return n.toLocaleString("pt-BR");
  }

  function rebuild() {
    var byDate = {};
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      var delta = t.type === "entrada" ? t.value : -t.value;
      byDate[t.date] = (byDate[t.date] || 0) + delta;
    }
    dailyDelta = byDate;
    sortedDates = Object.keys(byDate).sort();
    cumMap = {};
    var running = 0;
    for (var j = 0; j < sortedDates.length; j++) {
      running += byDate[sortedDates[j]];
      cumMap[sortedDates[j]] = running;
    }
    reserveTotal = 0;
    for (var k = 0; k < state.transactions.length; k++) {
      if (state.transactions[k].type === "economia") reserveTotal += state.transactions[k].value;
    }
    for (var r = 0; r < state.reserveAdjustments.length; r++) {
      var adj = state.reserveAdjustments[r];
      if (adj.type === "rendimento") reserveTotal += adj.value;
      else if (adj.type === "retirada") reserveTotal -= adj.value;
    }
  }

  function concreteBalanceAsOf(dateStr) {
    var lo = 0, hi = sortedDates.length - 1, ans = -1;
    while (lo <= hi) {
      var mid = (lo + hi) >> 1;
      if (sortedDates[mid] <= dateStr) { ans = mid; lo = mid + 1; }
      else hi = mid - 1;
    }
    return ans === -1 ? 0 : cumMap[sortedDates[ans]];
  }

  function diarioRangeStart(tpl) {
    return tpl.startDate > todayStr ? tpl.startDate : todayStr;
  }

  function diarioAppliesOnDay(tpl, dateStr) {
    if (dateStr < todayStr) return false;
    var rangeStart = diarioRangeStart(tpl);
    if (dateStr < rangeStart) return false;
    if (!tpl.indefinite && tpl.endDate && dateStr >= tpl.endDate) return false;
    return true;
  }

  function diarioCumulativeAsOf(tpl, dateStr) {
    if (dateStr < todayStr) return 0;
    var rangeStart = diarioRangeStart(tpl);
    if (dateStr < rangeStart) return 0;
    var effectiveEnd = dateStr;
    if (!tpl.indefinite && tpl.endDate) {
      var lastApplicable = addDays(tpl.endDate, -1);
      if (lastApplicable < effectiveEnd) effectiveEnd = lastApplicable;
    }
    if (effectiveEnd < rangeStart) return 0;
    var count = dayDiff(rangeStart, effectiveEnd) + 1;
    return -tpl.value * count;
  }

  function balanceAsOf(dateStr) {
    var total = concreteBalanceAsOf(dateStr);
    for (var i = 0; i < state.diarios.length; i++) {
      total += diarioCumulativeAsOf(state.diarios[i], dateStr);
    }
    return total;
  }

  var TYPE_ORDER = ["entrada", "saida", "diario", "economia"];

  function dayTypesPresent(dateStr) {
    var present = {};
    for (var i = 0; i < state.transactions.length; i++) {
      if (state.transactions[i].date === dateStr) present[state.transactions[i].type] = true;
    }
    if (dateStr >= todayStr) {
      for (var j = 0; j < state.diarios.length; j++) {
        if (diarioAppliesOnDay(state.diarios[j], dateStr)) present["diario"] = true;
      }
    }
    return TYPE_ORDER.filter(function (ty) { return present[ty]; });
  }

  function dayNetDelta(dateStr) {
    var d = dailyDelta.hasOwnProperty(dateStr) ? dailyDelta[dateStr] : 0;
    for (var i = 0; i < state.diarios.length; i++) {
      if (diarioAppliesOnDay(state.diarios[i], dateStr)) d += -state.diarios[i].value;
    }
    return d;
  }

  var currentView = "geral";

  function render() {
    rebuild();
    document.getElementById("yearLabel").textContent = state.year;
    document.getElementById("reserveValue").textContent = currency(reserveTotal);

    var todayBal = balanceAsOf(todayStr);
    var todayEl = document.getElementById("todayValue");
    todayEl.textContent = currency(todayBal);
    todayEl.className = "value " + (todayBal > 0 ? "positive" : todayBal < 0 ? "negative" : "");

    if (currentView === "geral") {
      renderGrid();
    } else {
      renderMonthlyView();
    }
  }

  function monthTotals(year, monthIdx) {
    var entrada = 0, saidaPix = 0, saidaCredito = 0, economia = 0;
    for (var i = 0; i < state.transactions.length; i++) {
      var t = state.transactions[i];
      var p = t.date.split("-").map(Number);
      if (p[0] === year && (p[1] - 1) === monthIdx) {
        if (t.type === "entrada") entrada += t.value;
        else if (t.type === "economia") economia += t.value;
        else if (t.type === "saida" && t.paymentMethod === "credito") saidaCredito += t.value;
        else saidaPix += t.value; // saída no pix + diário (lançamentos manuais em dias passados)
      }
    }
    var dim = daysInMonth(year, monthIdx);
    for (var day = 1; day <= dim; day++) {
      var key = fmtKey(year, monthIdx, day);
      for (var j = 0; j < state.diarios.length; j++) {
        if (diarioAppliesOnDay(state.diarios[j], key)) saidaPix += state.diarios[j].value;
      }
    }
    var saldo = entrada - saidaPix - saidaCredito - economia;
    return { entrada: entrada, saidaPix: saidaPix, saidaCredito: saidaCredito, economia: economia, saldo: saldo };
  }

  function renderMonthlyView() {
    var rows = "";
    for (var m = 0; m < 12; m++) {
      var tot = monthTotals(state.year, m);
      var saldoCls = tot.saldo > 0 ? "positive" : tot.saldo < 0 ? "negative" : "neutral";
      rows += "<tr>" +
        "<td class='month-name serif'>" + MONTH_FULL[m] + "</td>" +
        "<td class='entrada-amt'>" + currency(tot.entrada) + "</td>" +
        "<td class='saida-amt'>" + currency(tot.saidaPix) + "</td>" +
        "<td class='saida-amt'>" + currency(tot.saidaCredito) + "</td>" +
        "<td class='economia-amt'>" + currency(tot.economia) + "</td>" +
        "<td class='saldo " + saldoCls + "'>" + currency(tot.saldo) + "</td>" +
        "</tr>";
    }
    document.getElementById("monthlyTable").innerHTML =
      "<thead><tr><th>Mês</th><th>Entradas</th><th>Saída (Pix)</th><th>Saída (Crédito)</th><th>Economia</th><th>Saldo do mês</th></tr></thead>" +
      "<tbody>" + rows + "</tbody>";
  }

  function renderGrid() {
    var table = document.getElementById("grid");
    var html = "<thead><tr><th>dia</th>";
    for (var m = 0; m < 12; m++) html += "<th>" + MONTHS[m] + "</th>";
    html += "</tr></thead><tbody>";

    for (var day = 1; day <= 31; day++) {
      html += "<tr><th>" + day + "</th>";
      for (var mo = 0; mo < 12; mo++) {
        var dim = daysInMonth(state.year, mo);
        if (day > dim) {
          html += "<td class='void'></td>";
          continue;
        }
        var key = fmtKey(state.year, mo, day);
        var bal = balanceAsOf(key);
        var cls = bal > 0 ? "positive" : bal < 0 ? "negative" : "neutral";
        if (key === todayStr) cls += " today";
        var types = dayTypesPresent(key);
        var dotHtml = types.length
          ? "<span class='dots'>" + types.map(function (ty) { return "<span class='dot dot-" + ty + "'></span>"; }).join("") + "</span>"
          : "";
        html += "<td class='cell " + cls + "' data-date='" + key + "' title='" + currency(bal) + "'>" + dotHtml + compact(bal) + "</td>";
      }
      html += "</tr>";
    }
    html += "</tbody>";
    table.innerHTML = html;
    table.className = "grid-slide";

    var cells = table.querySelectorAll("td.cell");
    for (var i = 0; i < cells.length; i++) {
      cells[i].addEventListener("click", function () {
        openModal(this.getAttribute("data-date"));
      });
    }
  }

  // ---- Modal ----
  var overlay = document.getElementById("overlay");
  var modalDate = document.getElementById("modalDate");
  var modalBalance = document.getElementById("modalBalance");
  var movsList = document.getElementById("movsList");
  var actionsBox = document.getElementById("actionsBox");
  var currentDate = null;
  var editingTxId = null;
  var deletingTxId = null;
  var editingDiarioId = null;
  var deletingDiarioId = null;

  function openModal(dateStr) {
    currentDate = dateStr;
    editingTxId = null;
    deletingTxId = null;
    editingDiarioId = null;
    deletingDiarioId = null;
    var parts = dateStr.split("-").map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    modalDate.textContent = d.getDate() + " de " + MONTH_FULL[d.getMonth()] + " de " + parts[0];
    resetActions();
    refreshModalBody();
    overlay.classList.add("open");
  }

  function afterDataChange() {
    saveState();
    refreshModalBody();
    renderGrid();
    render();
  }

  function refreshModalBody() {
    rebuild();
    var bal = balanceAsOf(currentDate);
    modalBalance.innerHTML = "Saldo no dia: <strong>" + currency(bal) + "</strong>";

    var dayTx = state.transactions.filter(function (t) { return t.date === currentDate; });
    var activeDiarios = state.diarios.filter(function (tpl) { return diarioAppliesOnDay(tpl, currentDate); });

    if (dayTx.length === 0 && activeDiarios.length === 0) {
      movsList.innerHTML = "<li class='empty-movs' style='background:none;padding:0;'>Nenhuma movimentação neste dia ainda.</li>";
      return;
    }

    var labelMap = { entrada: "Entrada", saida: "Saída", economia: "Reserva", diario: "Diário" };
    var txHtml = dayTx.map(function (t) {
      if (editingTxId === t.id) {
        var monthsForGroup = 1;
        if (t.recurGroup) {
          monthsForGroup = state.transactions.filter(function (tx) {
            return tx.recurGroup === t.recurGroup && tx.date >= t.date;
          }).length;
        }
        var initialMonths = Math.min(monthsForGroup, 60);
        if (initialMonths < 1) initialMonths = 1;
        var recurrenceHtml = "";
        if (t.type !== "economia" && t.type !== "diario") {
          recurrenceHtml =
            "<div class='months-row' id='editMonthsRow' style='display:" + (t.indefinite ? "none" : "flex") + ";'>" +
            "<label for='editMonthsInput'>Repetir por quantos meses</label>" +
            "<input type='number' id='editMonthsInput' min='1' max='60' value='" + initialMonths + "'></div>" +
            "<label class='indefinite-toggle'><input type='checkbox' id='editIndefiniteCheck'" + (t.indefinite ? " checked" : "") + ">A perder de vista (repete até eu remover)</label>";
        }
        var paymentEditHtml = "";
        if (t.type === "saida") {
          var isCred = t.paymentMethod === "credito";
          paymentEditHtml =
            "<div class='payment-row'>" +
            "<label><input type='radio' name='editPaymentMethod' value='pix'" + (isCred ? "" : " checked") + ">Pix</label>" +
            "<label><input type='radio' name='editPaymentMethod' value='credito'" + (isCred ? " checked" : "") + ">Crédito</label>" +
            "</div>";
        }
        var hintHtml = t.recurGroup ? "<p class='edit-hint'>Vale a partir deste mês; os meses anteriores continuam como estão.</p>" : "";
        return "<li class='edit-row'>" +
          "<input type='text' inputmode='decimal' id='editValueInput' class='desc-input' value='" + escapeHtml(String(t.value).replace(".", ",")) + "'>" +
          "<input type='text' id='editDescInput' class='desc-input' value='" + escapeHtml(t.description || "") + "' placeholder='Descrição'>" +
          paymentEditHtml +
          recurrenceHtml +
          hintHtml +
          "<div class='form-actions'>" +
          "<button class='save-btn' id='editSaveBtn'>Salvar</button>" +
          "<button class='cancel-btn' id='editCancelBtn' aria-label='Cancelar'>×</button>" +
          "</div>" +
          "</li>";
      }
      if (deletingTxId === t.id) {
        var choices = t.recurGroup ?
          "<button data-action='only'>Somente este mês</button><button data-action='future'>Este e os próximos</button>" :
          "<button data-action='only'>Excluir</button>";
        return "<li class='confirm-row'>" +
          "<span>" + (t.recurGroup ? "Excluir recorrência:" : "Excluir este lançamento?") + "</span>" +
          choices +
          "<button data-action='cancel'>Cancelar</button>" +
          "</li>";
      }
      var pmText = (t.type === "saida" && t.paymentMethod === "credito") ? " · crédito" : (t.type === "saida" && t.paymentMethod === "pix") ? " · pix" : "";
      var tagText = labelMap[t.type] + pmText + (t.recurring ? (t.indefinite ? " · recorrente (sem fim)" : " · recorrente") : "");
      var descHtml = t.description ? "<span class='mov-desc'>" + escapeHtml(t.description) + "</span>" : "";
      return "<li><div class='mov-info'><span class='tag " + t.type + "'>" + tagText + "</span>" + descHtml + "</div>" +
        "<div class='mov-right'><span class='amount'>" + currency(t.value) + "</span>" +
        "<button class='edit' data-id='" + t.id + "' aria-label='Editar'>✎</button>" +
        "<button class='del' data-id='" + t.id + "' aria-label='Excluir'>×</button></div></li>";
    }).join("");

    var diarioHtml = activeDiarios.map(function (tpl) {
      if (editingDiarioId === tpl.id) {
        var initialMonths = 1;
        if (!tpl.indefinite && tpl.endDate) {
          initialMonths = Math.max(1, Math.min(60, Math.round(dayDiff(tpl.startDate, tpl.endDate) / 30)));
        }
        return "<li class='edit-row'>" +
          "<input type='text' inputmode='decimal' id='diarioEditValueInput' class='desc-input' value='" + escapeHtml(String(tpl.value).replace(".", ",")) + "'>" +
          "<input type='text' id='diarioEditDescInput' class='desc-input' value='" + escapeHtml(tpl.description || "") + "' placeholder='Descrição'>" +
          "<div class='months-row' id='diarioEditMonthsRow' style='display:" + (tpl.indefinite ? "none" : "flex") + ";'>" +
          "<label for='diarioEditMonthsInput'>Repetir por quantos meses</label>" +
          "<input type='number' id='diarioEditMonthsInput' min='1' max='60' value='" + initialMonths + "'></div>" +
          "<label class='indefinite-toggle'><input type='checkbox' id='diarioEditIndefiniteCheck'" + (tpl.indefinite ? " checked" : "") + ">A perder de vista (repete até eu remover)</label>" +
          "<div class='form-actions'>" +
          "<button class='save-btn' id='diarioEditSaveBtn'>Salvar</button>" +
          "<button class='cancel-btn' id='diarioEditCancelBtn' aria-label='Cancelar'>×</button>" +
          "</div></li>";
      }
      if (deletingDiarioId === tpl.id) {
        return "<li class='confirm-row'>" +
          "<span>Remover o diário automático?</span>" +
          "<button data-diario-action='remove'>Remover</button>" +
          "<button data-diario-action='cancel'>Cancelar</button>" +
          "</li>";
      }
      var descHtml2 = tpl.description ? "<span class='mov-desc'>" + escapeHtml(tpl.description) + "</span>" : "";
      var untilText = tpl.indefinite ? "sem fim" : ("até " + formatShortDate(tpl.endDate));
      return "<li><div class='mov-info'><span class='tag diario'>Diário automático · " + untilText + "</span>" + descHtml2 + "</div>" +
        "<div class='mov-right'><span class='amount'>" + currency(tpl.value) + "/dia</span>" +
        "<button class='diario-edit' data-diario-id='" + tpl.id + "' aria-label='Editar'>✎</button>" +
        "<button class='diario-del' data-diario-id='" + tpl.id + "' aria-label='Remover'>×</button></div></li>";
    }).join("");

    movsList.innerHTML = txHtml + diarioHtml;
    refreshDiarioWiring();

    var editBtns = movsList.querySelectorAll(".edit");
    for (var i = 0; i < editBtns.length; i++) {
      editBtns[i].addEventListener("click", function () {
        deletingTxId = null;
        editingTxId = this.getAttribute("data-id");
        refreshModalBody();
      });
    }

    var delBtns = movsList.querySelectorAll(".del");
    for (var j = 0; j < delBtns.length; j++) {
      delBtns[j].addEventListener("click", function () {
        editingTxId = null;
        deletingTxId = this.getAttribute("data-id");
        refreshModalBody();
      });
    }

    var editIndefiniteCheck = document.getElementById("editIndefiniteCheck");
    if (editIndefiniteCheck) {
      editIndefiniteCheck.addEventListener("change", function () {
        var row = document.getElementById("editMonthsRow");
        if (row) row.style.display = this.checked ? "none" : "flex";
      });
    }

    var editSaveBtn = document.getElementById("editSaveBtn");
    if (editSaveBtn) {
      editSaveBtn.addEventListener("click", function () {
        var id = editingTxId;
        var target = null;
        for (var idx = 0; idx < state.transactions.length; idx++) {
          if (String(state.transactions[idx].id) === String(id)) { target = state.transactions[idx]; break; }
        }
        if (!target) { editingTxId = null; refreshModalBody(); return; }

        var valInput = document.getElementById("editValueInput");
        var descInput = document.getElementById("editDescInput");
        var raw = valInput.value.trim().replace(/\./g, "").replace(",", ".");
        var value = parseFloat(raw);
        if (!value || value <= 0 || isNaN(value)) { valInput.focus(); return; }
        var description = descInput.value.trim();

        var months = 1;
        var isIndefinite = false;
        if (target.type !== "economia" && target.type !== "diario") {
          var editIndefCheck = document.getElementById("editIndefiniteCheck");
          isIndefinite = !!(editIndefCheck && editIndefCheck.checked);
          if (isIndefinite) {
            months = INDEFINITE_MONTHS;
          } else {
            var editMonthsInput = document.getElementById("editMonthsInput");
            if (editMonthsInput) {
              months = parseInt(editMonthsInput.value, 10);
              if (!months || months < 1) months = 1;
              if (months > 60) months = 60;
            }
          }
        }
        var isRecurringNew = months > 1;

        var paymentMethod = null;
        if (target.type === "saida") {
          var pmEditChecked = document.querySelector("input[name='editPaymentMethod']:checked");
          paymentMethod = pmEditChecked ? pmEditChecked.value : "pix";
        }

        var originalDate = target.date, originalType = target.type, originalGroup = target.recurGroup;

        state.transactions = state.transactions.filter(function (tx) {
          if (originalGroup) {
            if (tx.recurGroup !== originalGroup) return true;
            return tx.date < originalDate;
          }
          return String(tx.id) !== String(id);
        });

        var newGroupId = isRecurringNew ? (Date.now() + "-" + Math.random().toString(36).slice(2, 8)) : null;
        var parts = originalDate.split("-").map(Number);
        var startYear = parts[0], startMonthIdx = parts[1] - 1, startDay = parts[2];
        for (var i = 0; i < months; i++) {
          var targetMonthIdx = startMonthIdx + i;
          var targetYear = startYear + Math.floor(targetMonthIdx / 12);
          var normMonthIdx = ((targetMonthIdx % 12) + 12) % 12;
          var dim = daysInMonth(targetYear, normMonthIdx);
          var targetDay = Math.min(startDay, dim);
          var key = fmtKey(targetYear, normMonthIdx, targetDay);
          if (paymentMethod === "credito") key = creditBillDate(key);
          state.transactions.push({
            id: Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + i,
            type: originalType,
            value: Math.round(value * 100) / 100,
            date: key,
            description: description,
            recurring: isRecurringNew,
            recurGroup: newGroupId,
            paymentMethod: paymentMethod,
            indefinite: isIndefinite
          });
        }

        editingTxId = null;
        afterDataChange();
      });
      document.getElementById("editCancelBtn").addEventListener("click", function () {
        editingTxId = null;
        refreshModalBody();
      });
    }

    var confirmBtns = movsList.querySelectorAll("[data-action]");
    for (var m = 0; m < confirmBtns.length; m++) {
      confirmBtns[m].addEventListener("click", function () {
        var action = this.getAttribute("data-action");
        var id = deletingTxId;
        deletingTxId = null;
        if (action === "cancel") { refreshModalBody(); return; }
        if (action === "only") {
          state.transactions = state.transactions.filter(function (t) { return String(t.id) !== String(id); });
        } else if (action === "future") {
          var target = null;
          for (var n = 0; n < state.transactions.length; n++) {
            if (String(state.transactions[n].id) === String(id)) { target = state.transactions[n]; break; }
          }
          if (target && target.recurGroup) {
            var grp = target.recurGroup, fromDate = target.date;
            state.transactions = state.transactions.filter(function (t) {
              if (t.recurGroup !== grp) return true;
              return t.date < fromDate;
            });
          } else {
            state.transactions = state.transactions.filter(function (t) { return String(t.id) !== String(id); });
          }
        }
        afterDataChange();
      });
    }
  }

  function refreshDiarioWiring() {
    var diarioEditBtns = movsList.querySelectorAll(".diario-edit");
    for (var i = 0; i < diarioEditBtns.length; i++) {
      diarioEditBtns[i].addEventListener("click", function () {
        deletingDiarioId = null;
        editingDiarioId = this.getAttribute("data-diario-id");
        refreshModalBody();
      });
    }

    var diarioDelBtns = movsList.querySelectorAll(".diario-del");
    for (var j = 0; j < diarioDelBtns.length; j++) {
      diarioDelBtns[j].addEventListener("click", function () {
        editingDiarioId = null;
        deletingDiarioId = this.getAttribute("data-diario-id");
        refreshModalBody();
      });
    }

    var diarioEditIndefCheck = document.getElementById("diarioEditIndefiniteCheck");
    if (diarioEditIndefCheck) {
      diarioEditIndefCheck.addEventListener("change", function () {
        var row = document.getElementById("diarioEditMonthsRow");
        if (row) row.style.display = this.checked ? "none" : "flex";
      });
    }

    var diarioEditSaveBtn = document.getElementById("diarioEditSaveBtn");
    if (diarioEditSaveBtn) {
      diarioEditSaveBtn.addEventListener("click", function () {
        var tpl = null;
        for (var k = 0; k < state.diarios.length; k++) {
          if (String(state.diarios[k].id) === String(editingDiarioId)) { tpl = state.diarios[k]; break; }
        }
        if (!tpl) { editingDiarioId = null; refreshModalBody(); return; }
        var valInput = document.getElementById("diarioEditValueInput");
        var descInput = document.getElementById("diarioEditDescInput");
        var raw = valInput.value.trim().replace(/\./g, "").replace(",", ".");
        var value = parseFloat(raw);
        if (!value || value <= 0 || isNaN(value)) { valInput.focus(); return; }
        tpl.value = Math.round(value * 100) / 100;
        tpl.description = descInput.value.trim();
        var indefCheck = document.getElementById("diarioEditIndefiniteCheck");
        tpl.indefinite = !!(indefCheck && indefCheck.checked);
        if (tpl.indefinite) {
          tpl.endDate = null;
        } else {
          var monthsInput = document.getElementById("diarioEditMonthsInput");
          var months = parseInt(monthsInput.value, 10);
          if (!months || months < 1) months = 1;
          if (months > 60) months = 60;
          tpl.endDate = addMonthsToKey(tpl.startDate, months);
        }
        editingDiarioId = null;
        afterDataChange();
      });
      document.getElementById("diarioEditCancelBtn").addEventListener("click", function () {
        editingDiarioId = null;
        refreshModalBody();
      });
    }

    var diarioConfirmBtns = movsList.querySelectorAll("[data-diario-action]");
    for (var m = 0; m < diarioConfirmBtns.length; m++) {
      diarioConfirmBtns[m].addEventListener("click", function () {
        var action = this.getAttribute("data-diario-action");
        var id = deletingDiarioId;
        deletingDiarioId = null;
        if (action === "remove") {
          state.diarios = state.diarios.filter(function (d) { return String(d.id) !== String(id); });
          afterDataChange();
        } else {
          refreshModalBody();
        }
      });
    }
  }

  function resetActions() {
    actionsBox.innerHTML =
      "<button class='action-btn entrada' data-type='entrada'><span class='bar'></span>Entrada</button>" +
      "<button class='action-btn saida' data-type='saida'><span class='bar'></span>Saída</button>" +
      "<button class='action-btn economia' data-type='economia'><span class='bar'></span>Economia (mover para reserva)</button>" +
      "<button class='action-btn diario' data-type='diario'><span class='bar'></span>Diário</button>";
    var btns = actionsBox.querySelectorAll(".action-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        showForm(this.getAttribute("data-type"));
      });
    }
  }

  function showForm(type) {
    if (type === "diario") { showDiarioForm(); return; }
    var labels = { entrada: "Valor da entrada", saida: "Valor da saída", economia: "Valor para a reserva" };
    var warnHtml = "";
    if (type === "economia") {
      var bal = balanceAsOf(currentDate);
      if (bal <= 0) {
        warnHtml = "<p class='warn'>Atenção: o saldo neste dia é " + currency(bal) + ".</p>";
      }
    }
    var monthsHtml = "";
    if (type !== "economia") {
      monthsHtml =
        "<div class='months-row' id='monthsRow'><label for='monthsInput'>Repetir por quantos meses</label>" +
        "<input type='number' id='monthsInput' min='1' max='60' value='1'></div>" +
        "<label class='indefinite-toggle'><input type='checkbox' id='indefiniteCheck'>A perder de vista (repete até eu remover)</label>";
    }
    var paymentHtml = "";
    if (type === "saida") {
      paymentHtml =
        "<div class='payment-row'>" +
        "<label><input type='radio' name='paymentMethod' value='pix' checked>Pix</label>" +
        "<label><input type='radio' name='paymentMethod' value='credito'>Crédito</label>" +
        "</div>" +
        "<p class='edit-hint'>No crédito, entra na fatura do dia 14 (ou do mês seguinte, se já tiver passado do dia 14).</p>";
    }

    actionsBox.innerHTML =
      warnHtml +
      "<div class='form-block " + type + "'>" +
      "<div class='form-value-row'><span class='bar'></span>" +
      "<input type='text' inputmode='decimal' id='valueInput' placeholder='" + labels[type] + " (R$)' autofocus></div>" +
      "<input type='text' id='descInput' class='desc-input' placeholder='Descrição (opcional)'>" +
      paymentHtml +
      monthsHtml +
      "<div class='form-actions'>" +
      "<button class='save-btn' id='saveBtn'>Salvar</button>" +
      "<button class='cancel-btn' id='cancelBtn' aria-label='Cancelar'>×</button>" +
      "</div>" +
      "</div>";

    if (type !== "economia") {
      document.getElementById("indefiniteCheck").addEventListener("change", function () {
        var monthsRow = document.getElementById("monthsRow");
        monthsRow.style.display = this.checked ? "none" : "flex";
      });
    }
    document.getElementById("cancelBtn").addEventListener("click", resetActions);
    document.getElementById("saveBtn").addEventListener("click", function () { submitForm(type); });
    var input = document.getElementById("valueInput");
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") submitForm(type);
    });
    input.focus();
  }

  function submitForm(type) {
    var input = document.getElementById("valueInput");
    var raw = input.value.trim().replace(/\./g, "").replace(",", ".");
    var value = parseFloat(raw);
    if (!value || value <= 0 || isNaN(value)) {
      input.placeholder = "Digite um valor válido";
      input.focus();
      return;
    }
    var descInput = document.getElementById("descInput");
    var description = descInput ? descInput.value.trim() : "";

    var months = 1;
    var isIndefinite = false;
    if (type !== "economia") {
      var indefiniteCheck = document.getElementById("indefiniteCheck");
      isIndefinite = !!(indefiniteCheck && indefiniteCheck.checked);
      if (isIndefinite) {
        months = INDEFINITE_MONTHS;
      } else {
        var monthsInput = document.getElementById("monthsInput");
        if (monthsInput) {
          months = parseInt(monthsInput.value, 10);
          if (!months || months < 1) months = 1;
          if (months > 60) months = 60;
        }
      }
    }
    var isRecurring = months > 1;

    var paymentMethod = null;
    if (type === "saida") {
      var pmChecked = document.querySelector("input[name='paymentMethod']:checked");
      paymentMethod = pmChecked ? pmChecked.value : "pix";
    }

    var parts = currentDate.split("-").map(Number);
    var startYear = parts[0], startMonthIdx = parts[1] - 1, startDay = parts[2];
    var groupId = Date.now() + "-" + Math.random().toString(36).slice(2, 8);

    for (var i = 0; i < months; i++) {
      var targetMonthIdx = startMonthIdx + i;
      var targetYear = startYear + Math.floor(targetMonthIdx / 12);
      var normMonthIdx = ((targetMonthIdx % 12) + 12) % 12;
      var dim = daysInMonth(targetYear, normMonthIdx);
      var targetDay = Math.min(startDay, dim);
      var key = fmtKey(targetYear, normMonthIdx, targetDay);
      if (paymentMethod === "credito") key = creditBillDate(key);
      state.transactions.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-" + i,
        type: type,
        value: Math.round(value * 100) / 100,
        date: key,
        description: description,
        recurring: isRecurring,
        recurGroup: isRecurring ? groupId : null,
        indefinite: isIndefinite,
        paymentMethod: paymentMethod
      });
    }

    saveState();
    resetActions();
    refreshModalBody();
    renderGrid();
    render();
  }

  function showDiarioForm() {
    var isFuture = currentDate >= todayStr;
    var recurrenceHtml = "";
    if (isFuture) {
      recurrenceHtml =
        "<div class='months-row' id='monthsRow'><label for='monthsInput'>Repetir por quantos meses</label>" +
        "<input type='number' id='monthsInput' min='1' max='60' value='1'></div>" +
        "<label class='indefinite-toggle'><input type='checkbox' id='indefiniteCheck'>A perder de vista (repete até eu remover)</label>";
    }
    var noteHtml = isFuture
      ? "<p class='edit-hint'>Descontado automaticamente todo dia, a partir de hoje.</p>"
      : "<p class='edit-hint'>Dia passado: registre aqui o valor que você realmente gastou.</p>";

    actionsBox.innerHTML =
      "<div class='form-block diario'>" +
      "<div class='form-value-row'><span class='bar'></span>" +
      "<input type='text' inputmode='decimal' id='valueInput' placeholder='Valor do diário (R$)' autofocus></div>" +
      "<input type='text' id='descInput' class='desc-input' placeholder='Descrição (opcional)'>" +
      recurrenceHtml +
      noteHtml +
      "<div class='form-actions'>" +
      "<button class='save-btn' id='saveBtn'>Salvar</button>" +
      "<button class='cancel-btn' id='cancelBtn' aria-label='Cancelar'>×</button>" +
      "</div></div>";

    if (isFuture) {
      document.getElementById("indefiniteCheck").addEventListener("change", function () {
        var monthsRow = document.getElementById("monthsRow");
        monthsRow.style.display = this.checked ? "none" : "flex";
      });
    }
    document.getElementById("cancelBtn").addEventListener("click", resetActions);
    document.getElementById("saveBtn").addEventListener("click", submitDiarioForm);
    var input = document.getElementById("valueInput");
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") submitDiarioForm(); });
    input.focus();
  }

  function submitDiarioForm() {
    var input = document.getElementById("valueInput");
    var raw = input.value.trim().replace(/\./g, "").replace(",", ".");
    var value = parseFloat(raw);
    if (!value || value <= 0 || isNaN(value)) {
      input.placeholder = "Digite um valor válido";
      input.focus();
      return;
    }
    var descInput = document.getElementById("descInput");
    var description = descInput.value.trim();
    var isFuture = currentDate >= todayStr;

    if (!isFuture) {
      state.transactions.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        type: "diario",
        value: Math.round(value * 100) / 100,
        date: currentDate,
        description: description,
        recurring: false,
        recurGroup: null,
        indefinite: false
      });
    } else {
      var indefiniteCheck = document.getElementById("indefiniteCheck");
      var isIndefinite = !!(indefiniteCheck && indefiniteCheck.checked);
      var endDate = null;
      if (!isIndefinite) {
        var monthsInput = document.getElementById("monthsInput");
        var months = parseInt(monthsInput.value, 10);
        if (!months || months < 1) months = 1;
        if (months > 60) months = 60;
        endDate = addMonthsToKey(currentDate, months);
      }
      state.diarios.push({
        id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
        value: Math.round(value * 100) / 100,
        description: description,
        startDate: currentDate,
        endDate: endDate,
        indefinite: isIndefinite
      });
    }

    saveState();
    resetActions();
    refreshModalBody();
    renderGrid();
    render();
  }

  document.getElementById("closeModal").addEventListener("click", closeModal);
  overlay.addEventListener("click", function (e) {
    if (e.target === overlay) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && overlay.classList.contains("open")) closeModal();
  });
  function closeModal() {
    overlay.classList.remove("open");
    currentDate = null;
  }

  document.getElementById("prevYear").addEventListener("click", function () {
    state.year -= 1;
    render();
  });
  document.getElementById("nextYear").addEventListener("click", function () {
    state.year += 1;
    render();
  });

  var viewTabs = document.querySelectorAll(".view-tab");
  var geralWrap = document.getElementById("geralWrap");
  var mensalWrap = document.getElementById("mensalWrap");
  var viewHint = document.getElementById("viewHint");
  for (var vt = 0; vt < viewTabs.length; vt++) {
    viewTabs[vt].addEventListener("click", function () {
      currentView = this.getAttribute("data-view");
      for (var k = 0; k < viewTabs.length; k++) viewTabs[k].classList.remove("active");
      this.classList.add("active");
      geralWrap.style.display = currentView === "geral" ? "" : "none";
      mensalWrap.style.display = currentView === "mensal" ? "" : "none";
      viewHint.style.display = currentView === "geral" ? "" : "none";
      render();
    });
  }

  // ---- Reserve modal ----
  var reservePill = document.getElementById("reservePill");
  var reserveOverlay = document.getElementById("reserveOverlay");
  var reserveModalValue = document.getElementById("reserveModalValue");
  var reserveMovsList = document.getElementById("reserveMovsList");
  var reserveActionsBox = document.getElementById("reserveActionsBox");

  reservePill.addEventListener("click", openReserveModal);
  reservePill.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openReserveModal(); }
  });
  document.getElementById("closeReserveModal").addEventListener("click", closeReserveModal);
  reserveOverlay.addEventListener("click", function (e) {
    if (e.target === reserveOverlay) closeReserveModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && reserveOverlay.classList.contains("open")) closeReserveModal();
  });

  function openReserveModal() {
    resetReserveActions();
    refreshReserveModal();
    reserveOverlay.classList.add("open");
  }
  function closeReserveModal() {
    reserveOverlay.classList.remove("open");
  }

  function refreshReserveModal() {
    rebuild();
    reserveModalValue.textContent = currency(reserveTotal);

    if (state.reserveAdjustments.length === 0) {
      reserveMovsList.innerHTML = "<li class='empty-movs' style='background:none;padding:0;'>Nenhum ajuste registrado ainda.</li>";
      return;
    }
    var typeLabel = { rendimento: "Rendimento", retirada: "Retirada" };
    var sorted = state.reserveAdjustments.slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    reserveMovsList.innerHTML = sorted.map(function (a) {
      var descHtml = a.description ? "<span class='mov-desc'>" + escapeHtml(a.description) + "</span>" : "";
      var tagClass = a.type === "rendimento" ? "economia" : "saida";
      return "<li><div class='mov-info'><span class='tag " + tagClass + "'>" + typeLabel[a.type] + "</span>" + descHtml + "</div>" +
        "<div class='mov-right'><span class='amount'>" + currency(a.value) + "</span>" +
        "<button class='del' data-id='" + a.id + "' aria-label='Excluir'>×</button></div></li>";
    }).join("");
    var delBtns = reserveMovsList.querySelectorAll(".del");
    for (var i = 0; i < delBtns.length; i++) {
      delBtns[i].addEventListener("click", function () {
        var id = this.getAttribute("data-id");
        var adj = null;
        for (var j = 0; j < state.reserveAdjustments.length; j++) {
          if (String(state.reserveAdjustments[j].id) === id) { adj = state.reserveAdjustments[j]; break; }
        }
        state.reserveAdjustments = state.reserveAdjustments.filter(function (a) { return String(a.id) !== id; });
        if (adj && adj.linkedTransactionId) {
          state.transactions = state.transactions.filter(function (t) { return String(t.id) !== String(adj.linkedTransactionId); });
        }
        saveState();
        refreshReserveModal();
        render();
      });
    }
  }

  function resetReserveActions() {
    reserveActionsBox.innerHTML =
      "<button class='action-btn economia' data-rtype='rendimento'><span class='bar'></span>Ajustar (rendeu na reserva)</button>" +
      "<button class='action-btn saida' data-rtype='retirada'><span class='bar'></span>Retirar da reserva</button>";
    var btns = reserveActionsBox.querySelectorAll(".action-btn");
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener("click", function () {
        showReserveForm(this.getAttribute("data-rtype"));
      });
    }
  }

  function showReserveForm(rtype) {
    var labels = { rendimento: "Valor do rendimento", retirada: "Valor a retirar" };
    var barClass = rtype === "rendimento" ? "economia" : "saida";
    reserveActionsBox.innerHTML =
      "<div class='form-block " + barClass + "'>" +
      "<div class='form-value-row'><span class='bar'></span>" +
      "<input type='text' inputmode='decimal' id='reserveValueInput' placeholder='" + labels[rtype] + " (R$)' autofocus></div>" +
      "<input type='text' id='reserveDescInput' class='desc-input' placeholder='Descrição (opcional)'>" +
      "<div class='form-actions'>" +
      "<button class='save-btn' id='reserveSaveBtn'>Salvar</button>" +
      "<button class='cancel-btn' id='reserveCancelBtn' aria-label='Cancelar'>×</button>" +
      "</div></div>";
    document.getElementById("reserveCancelBtn").addEventListener("click", resetReserveActions);
    document.getElementById("reserveSaveBtn").addEventListener("click", function () { submitReserveForm(rtype); });
    var inp = document.getElementById("reserveValueInput");
    inp.addEventListener("keydown", function (e) { if (e.key === "Enter") submitReserveForm(rtype); });
    inp.focus();
  }

  function submitReserveForm(rtype) {
    var input = document.getElementById("reserveValueInput");
    var raw = input.value.trim().replace(/\./g, "").replace(",", ".");
    var value = parseFloat(raw);
    if (!value || value <= 0 || isNaN(value)) {
      input.placeholder = "Digite um valor válido";
      input.focus();
      return;
    }
    var descInput = document.getElementById("reserveDescInput");
    var description = descInput ? descInput.value.trim() : "";
    var adjId = Date.now() + "-" + Math.random().toString(36).slice(2, 8);

    if (rtype === "retirada") {
      var txId = Date.now() + "-" + Math.random().toString(36).slice(2, 8) + "-tx";
      state.transactions.push({
        id: txId,
        type: "entrada",
        value: Math.round(value * 100) / 100,
        date: todayStr,
        description: description || "Retirada da reserva",
        recurring: false,
        recurGroup: null
      });
      state.reserveAdjustments.push({
        id: adjId,
        type: "retirada",
        value: Math.round(value * 100) / 100,
        date: todayStr,
        description: description,
        linkedTransactionId: txId
      });
    } else {
      state.reserveAdjustments.push({
        id: adjId,
        type: "rendimento",
        value: Math.round(value * 100) / 100,
        date: todayStr,
        description: description
      });
    }

    saveState();
    resetReserveActions();
    refreshReserveModal();
    render();
  }

  document.getElementById("resetAllBtn").addEventListener("click", function () {
    var ok = window.confirm("Isso vai apagar todos os lançamentos e a reserva de emergência. Não é possível desfazer. Deseja continuar?");
    if (!ok) return;
    state.transactions = [];
    state.reserveAdjustments = [];
    state.diarios = [];
    saveState();
    render();
  });

  document.getElementById("exportBtn").addEventListener("click", function () {
    var payload = {
      exportedAt: new Date().toISOString(),
      transactions: state.transactions,
      reserveAdjustments: state.reserveAdjustments,
      diarios: state.diarios
    };
    var json = JSON.stringify(payload, null, 2);
    var blob = new Blob([json], { type: "application/json" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var stamp = fmtKey(todayObj.getFullYear(), todayObj.getMonth(), todayObj.getDate());
    a.href = url;
    a.download = "livro-caixa-" + stamp + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  var importFileInput = document.getElementById("importFileInput");
  document.getElementById("importBtn").addEventListener("click", function () {
    importFileInput.value = "";
    importFileInput.click();
  });
  importFileInput.addEventListener("change", function () {
    var file = importFileInput.files && importFileInput.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      var parsed;
      try {
        parsed = JSON.parse(String(reader.result));
      } catch (e) {
        window.alert("Esse arquivo não é um JSON válido do Livro-Caixa.");
        return;
      }
      var incoming = {
        transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
        reserveAdjustments: Array.isArray(parsed.reserveAdjustments) ? parsed.reserveAdjustments : [],
        diarios: Array.isArray(parsed.diarios) ? parsed.diarios : []
      };
      var hasCurrentData = state.transactions.length > 0 || state.reserveAdjustments.length > 0 || state.diarios.length > 0;
      var replace = true;
      if (hasCurrentData) {
        replace = window.confirm("Substituir os dados atuais pelos do arquivo importado? Clique em Cancelar para mesclar (somar) com o que já está aqui.");
      }
      if (replace) {
        state.transactions = incoming.transactions;
        state.reserveAdjustments = incoming.reserveAdjustments;
        state.diarios = incoming.diarios;
      } else {
        state.transactions = state.transactions.concat(incoming.transactions);
        state.reserveAdjustments = state.reserveAdjustments.concat(incoming.reserveAdjustments);
        state.diarios = state.diarios.concat(incoming.diarios);
      }
      saveState();
      render();
      window.alert("Dados importados com sucesso.");
    };
    reader.onerror = function () {
      window.alert("Não foi possível ler esse arquivo.");
    };
    reader.readAsText(file);
  });

  render();
})();
</script>
</body>
</html>
